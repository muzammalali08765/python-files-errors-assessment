<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" width="1000" height="435" role="img" aria-label="Overview of the two tasks" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Overview of the two tasks</title>
